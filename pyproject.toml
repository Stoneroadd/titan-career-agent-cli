[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-career-agent-cli"
version = "0.1.0"
description = "Local CLI for job discovery, CV review, and evidence-linked tailoring with multiple LLMs"
requires-python = ">=3.10"
dependencies = ["pypdf>=5,<7", "python-docx>=1.1,<2"]

[project.scripts]
career-agent = "career_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
